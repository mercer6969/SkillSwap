<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillSwap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="gradient-theme.css">
    <script src="auth.js"></script>
    <script src="crypto.js"></script>
    <style>
        body { background: #0D0D0D; }
        .auth-card { background:#151515; border:1px solid rgba(255,255,255,0.08); border-radius:20px; }
        .form-label { font-size:13px; color:#888580; font-weight:500; margin-bottom:6px; display:block; }
        .form-input {
            width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
            border-radius:12px; padding:12px 16px; color:#F5F0E8; font-size:15px; outline:none;
            transition:border-color .2s,box-shadow .2s; font-family:'DM Sans',sans-serif;
        }
        .form-input:focus { border-color:#E8460A; box-shadow:0 0 0 3px rgba(232,70,10,0.12); }
        .form-input::placeholder { color:#555; }
        .orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; }

        /* OAuth buttons */
        .oauth-btn {
            width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
            padding:11px 16px; border-radius:12px; font-size:14px; font-weight:500;
            cursor:pointer; text-decoration:none; transition:all .2s;
            border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04); color:#F5F0E8;
        }
        .oauth-btn:hover { background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.2); transform:translateY(-1px); }
        .oauth-btn svg { flex-shrink:0; }
        .divider { display:flex; align-items:center; gap:12px; margin:4px 0; }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.07); }
        .divider span { font-size:12px; color:#555; white-space:nowrap; }
        #serverError {
            display:none; background:rgba(232,70,10,0.1); border:1px solid rgba(232,70,10,0.3);
            color:#FF6B35; border-radius:10px; padding:10px 14px; font-size:13px;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen font-sans">
    <div class="orb" style="width:350px;height:350px;background:rgba(232,70,10,0.1);top:-60px;right:-60px;z-index:0;"></div>
    <div class="orb" style="width:250px;height:250px;background:rgba(232,70,10,0.07);bottom:-40px;left:-40px;z-index:0;"></div>

    <nav class="bg-glass sticky top-0 z-50" style="border-bottom:1px solid rgba(255,255,255,0.07);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex-shrink-0 flex items-center gap-8">
                    <a href="splash.html" class="font-bluesakura text-xl" style="color:#F5F0E8;">SKiLlSWaP</a>
                    <div class="hidden sm:flex space-x-1">
                        <a href="discover.html" class="nav-link">Discover</a>
                        <a href="index.html#features" class="nav-link">Features</a>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <a href="login.html"  class="nav-link nav-link-active">Log in</a>
                    <a href="signup.html" class="gradient-button px-4 py-2 rounded-lg text-sm font-medium text-white">Sign up</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="relative z-10 flex items-center justify-center min-h-[calc(100vh-64px)] py-12 px-4">
        <div class="auth-card w-full max-w-md p-8 animate-fade-in-up">

            <div class="text-center mb-7">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background:rgba(232,70,10,0.15);border:1px solid rgba(232,70,10,0.3);">
                    <svg class="w-7 h-7" style="color:#E8460A;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold mb-1" style="font-family:'Syne',sans-serif;color:#F5F0E8;">Welcome Back</h2>
                <p class="text-sm" style="color:#888580;">Sign in to continue your learning journey</p>
            </div>

            <!-- OAuth buttons -->
            <div class="space-y-3 mb-5">
                <a href="/auth/google" class="oauth-btn">
                    <!-- Google icon -->
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </a>
                <a href="/auth/github" class="oauth-btn">
                    <!-- GitHub icon -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#F5F0E8">
                        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    Continue with GitHub
                </a>
                <a href="/auth/discord" class="oauth-btn">
                    <!-- Discord icon -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#5865F2">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                    Continue with Discord
                </a>
            </div>

            <div class="divider"><span>or sign in with email</span></div>

            <div id="serverError" class="my-3"></div>

            <form id="loginForm" class="space-y-4 mt-4">
                <div>
                    <label class="form-label" for="email">Email address</label>
                    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" class="form-input">
                    <p id="email-error" class="text-xs mt-1 hidden" style="color:#E8460A;"></p>
                </div>
                <div>
                    <label class="form-label" for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" class="form-input">
                    <p id="password-error" class="text-xs mt-1 hidden" style="color:#E8460A;"></p>
                </div>
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" style="accent-color:#E8460A;">
                        <span class="text-sm" style="color:#888580;">Remember me</span>
                    </label>
                    <a href="#" class="text-sm font-medium" style="color:#E8460A;">Forgot password?</a>
                </div>
                <button type="submit" id="submitBtn" class="gradient-button w-full py-3 rounded-xl text-white font-semibold text-sm">
                    Sign in →
                </button>
            </form>

            <div class="mt-6 pt-6 text-center" style="border-top:1px solid rgba(255,255,255,0.07);">
                <p class="text-sm" style="color:#888580;">
                    Don't have an account?
                    <a href="signup.html" class="font-semibold ml-1" style="color:#E8460A;">Sign up free</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        if (Auth.getToken()) window.location.href = 'discover.html';

        // Show OAuth error from URL
        const urlErr = new URLSearchParams(window.location.search).get('error');
        if (urlErr) {
            const el = document.getElementById('serverError');
            const messages = {
                google_not_configured:  '⚙️ Google login is not set up yet — add GOOGLE_CLIENT_ID to your .env file.',
                github_not_configured:  '⚙️ GitHub login is not set up yet — add GITHUB_CLIENT_ID to your .env file.',
                discord_not_configured: '⚙️ Discord login is not set up yet — add DISCORD_CLIENT_ID to your .env file.',
                google_failed:          'Google sign-in failed. Please try again or use email.',
                github_failed:          'GitHub sign-in failed. Please try again or use email.',
                discord_failed:         'Discord sign-in failed. Please try again or use email.',
                oauth_failed:           'Sign-in failed. Please try again.',
            };
            el.textContent = messages[urlErr] || `Sign-in error: ${urlErr.replace(/_/g,' ')}`;
            el.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('submitBtn');
            const errBanner = document.getElementById('serverError');
            let valid = true;
            errBanner.style.display = 'none';

            if (!email || !/\S+@\S+\.\S+/.test(email)) {
                document.getElementById('email-error').textContent = !email ? 'Email required' : 'Invalid email';
                document.getElementById('email-error').classList.remove('hidden'); valid = false;
            } else document.getElementById('email-error').classList.add('hidden');

            if (!password) {
                document.getElementById('password-error').textContent = 'Password required';
                document.getElementById('password-error').classList.remove('hidden'); valid = false;
            } else document.getElementById('password-error').classList.add('hidden');

            if (!valid) return;
            btn.disabled = true; btn.textContent = 'Signing in…';

            try {
                const res  = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password}) });
                const data = await res.json();
                if (!res.ok) { errBanner.textContent = data.error||'Login failed'; errBanner.style.display='block'; return; }
                Auth.save(data.token, data.user);
                try {
                    const kp  = await SkillSwapCrypto.getOrCreateKeyPair();
                    const jwk = await SkillSwapCrypto.exportPublicKey(kp);
                    await Auth.apiFetch('/api/users/me/public-key', { method:'POST', body:JSON.stringify({publicKey:jwk}) });
                } catch {}
                window.location.href = 'discover.html';
            } catch {
                errBanner.textContent = 'Network error — is the backend running?'; errBanner.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Sign in →';
            }
        });
    </script>
</body>
</html>
