<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in… - SkillSwap</title>
    <script src="auth.js"></script>
    <script src="crypto.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0D0D0D;
            color: #F5F0E8;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 2.5rem 3rem;
            background: #151515;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            max-width: 360px;
            width: 90%;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(232,70,10,0.2);
            border-top-color: #E8460A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: .5rem; }
        p  { font-size: .875rem; color: #888580; }
        .error { color: #E8460A; font-size: .875rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="spinner"></div>
    <h2>Signing you in…</h2>
    <p>Setting up your encrypted workspace</p>
    <p class="error" id="err"></p>
</div>
<script>
(async () => {
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const userRaw = params.get('user');
    const error  = params.get('error');

    if (error || !token || !userRaw) {
        document.getElementById('err').textContent = 'OAuth sign-in failed. Redirecting to login…';
        document.getElementById('err').style.display = 'block';
        setTimeout(() => window.location.href = 'login.html', 2500);
        return;
    }

    try {
        const user = JSON.parse(decodeURIComponent(userRaw));
        Auth.save(token, user);

        // Generate / upload E2E key pair
        const kp  = await SkillSwapCrypto.getOrCreateKeyPair();
        const jwk = await SkillSwapCrypto.exportPublicKey(kp);
        await Auth.apiFetch('/api/users/me/public-key', {
            method: 'POST',
            body:   JSON.stringify({ publicKey: jwk }),
        });
    } catch (e) {
        console.warn('OAuth callback error (non-fatal):', e);
    }

    window.location.href = 'discover.html';
})();
</script>
</body>
</html>
